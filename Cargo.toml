[package]
name = "availkit-sdk"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
description = "Typed AvailKit workspace and public booking clients with explicit intent retention"
license = "MIT"
homepage = "https://availkit.dev"
repository = "https://github.com/availkit/sdk-rust"
documentation = "https://availkit.dev/sdk/rust"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "VERSION",
    "coverage.json",
    "runtime-policy.json",
    "generate.py",
    "build.py",
    "src/lib.rs",
    "src/models.rs",
    "src/methods.rs",
    "src/validation.rs",
    "src/relations.rs",
    "src/private_files.rs",
    "src/schemas.json",
    "src/operations.json",
    "examples/first_booking.rs",
    "examples/public_booking.rs",
    "tests/transport.rs",
    "tests/fixtures.json",
    "tests/package_test.py",
    "CHANGELOG.md",
    "SECURITY.md",
    "SUPPORT.md",
    "DEVELOPMENT.md",
    "contract-projection.json",
    "contracts/api.openapi.json",
    "contracts/check_projection.py",
]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.11.1"
hmac = "=0.13.0"
base64 = "=0.23.1"
getrandom = "=0.4.3"
libc = "=0.2.190"

[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
